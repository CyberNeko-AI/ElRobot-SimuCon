[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "st3215"
version = "0.1.0"
description = "ST3215 serial-bus servo driver and auto-calibration (Python bindings)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }

[tool.maturin]
features = ["python"]
module-name = "st3215._st3215"
python-source = "python"
